name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    name: API security and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q agent server
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  native:
    name: Flutter analyzer and widget tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  android:
    name: Android debug APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-metrics-android-debug
          path: apps/native/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  linux:
    name: Native Linux build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtk-3-dev pkg-config
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package native Debian development installer
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)
          bash ../../scripts/package_linux_deb.sh build/linux/x64/release/bundle "$version" ../../artifacts
          dpkg-deb --info "../../artifacts/goreecloud-metrics_${version}_amd64.deb"
          (cd ../../artifacts && sha256sum -c "goreecloud-metrics_${version}_amd64.deb.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-metrics-linux-amd64-deb-preview
          path: |
            artifacts/*.deb
            artifacts/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-metrics-linux-x64
          path: apps/native/build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14
