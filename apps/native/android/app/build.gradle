plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// No debug-keystore fallback for release artifacts. Signing credentials are
// provided only by a separately authorized secure environment.
def releaseSigningFields = [
    "GOREEMETRICS_ANDROID_KEYSTORE",
    "GOREEMETRICS_ANDROID_KEY_ALIAS",
    "GOREEMETRICS_ANDROID_STORE_PASSWORD",
    "GOREEMETRICS_ANDROID_KEY_PASSWORD"
]
def releaseSigningReady = releaseSigningFields.every {
    System.getenv(it)?.trim()
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(java.util.Locale.ROOT).contains("release")
}
if (releaseTaskRequested && !releaseSigningReady) {
    throw new GradleException("Release signing requires all four GOREEMETRICS_ANDROID_* environment variables")
}
def releaseKeystoreFile = releaseSigningReady ? new File(System.getenv("GOREEMETRICS_ANDROID_KEYSTORE")) : null
if (releaseTaskRequested && (!releaseKeystoreFile.isAbsolute() || !releaseKeystoreFile.isFile())) {
    throw new GradleException("Release keystore must be an existing regular file at an absolute path")
}
if (releaseTaskRequested &&
    releaseKeystoreFile.canonicalPath.startsWith(rootProject.projectDir.parentFile.parentFile.parentFile.canonicalPath + File.separator)) {
    throw new GradleException("Release keystore must be stored outside the repository source tree")
}

android {
    namespace = "com.goreecloud.goreecloud_metrics"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.goreecloud.goreecloud_metrics"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseKeystoreFile
                keyAlias System.getenv("GOREEMETRICS_ANDROID_KEY_ALIAS")
                storePassword System.getenv("GOREEMETRICS_ANDROID_STORE_PASSWORD")
                keyPassword System.getenv("GOREEMETRICS_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // No signing configuration without an explicit release key.
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}
